[package]
name = "igris-providers"
description = "Igris sandboxed provider binaries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "igris_providers"
path = "src/lib.rs"

[[bin]]
name = "igris-fs-provider"
path = "src/fs_provider.rs"

[[bin]]
name = "igris-process-provider"
path = "src/process_provider.rs"

[[bin]]
name = "igris-system-provider"
path = "src/system_provider.rs"

[[bin]]
name = "igris-events-provider"
path = "src/events_provider.rs"

[dependencies]
igris-proto.workspace = true
igris-sandbox.workspace = true
igris-tool-registry.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
nix = { version = "0.29", features = ["sched", "user", "mount", "process"] }
thiserror = "1.0"
tracing = "0.1"
inotify = "0.10"

[dev-dependencies]
igris-proto.workspace = true
serde_json.workspace = true
tempfile = "3.0"