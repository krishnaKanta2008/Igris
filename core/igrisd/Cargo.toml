[package]
name = "igrisd"
description = "Igris core service daemon: privileged IPC hub routing to narrowly scoped providers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "igrisd"
path = "src/lib.rs"

[[bin]]
name = "igrisd"
path = "src/main.rs"

[dependencies]
igris-proto.workspace = true
igris-permd.workspace = true
igris-sandbox.workspace = true
igris-tool-registry.workspace = true
igris-session.workspace = true
igris-confirmation.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
inotify = "0.10"
uuid = { version = "1.0", features = ["v4", "serde", "fast-rng"] }
nix.workspace = true

[dev-dependencies]
igris-proto.workspace = true
igris-permd.workspace = true
serde_json.workspace = true
