[workspace]
resolver = "2"
members = [
    "core/igris-proto",
    "core/igris-permd",
    "core/igris-sandbox",
    "core/igris-tool-registry",
    "core/igris-session",
    "core/igris-confirmation",
    "core/igris-mock-agent",
    "core/igris-providers",
    "core/igrisd",
    "core/igrisctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
authors = ["Igris OS Project"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
igris-proto = { path = "core/igris-proto" }
igris-permd = { path = "core/igris-permd" }
igris-sandbox = { path = "core/igris-sandbox" }
igris-tool-registry = { path = "core/igris-tool-registry" }
igris-session = { path = "core/igris-session" }
igris-confirmation = { path = "core/igris-confirmation" }
igris-mock-agent = { path = "core/igris-mock-agent" }
igris-providers = { path = "core/igris-providers" }